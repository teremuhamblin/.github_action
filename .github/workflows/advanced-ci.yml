name: Advanced CI

on:
  push:
  pull_request:

jobs:
  build-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      # 1. Checkout du dépôt
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Cache intelligent (Node.js ici, adaptable)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      # 3. Installation des dépendances
      - name: Install dependencies
        run: npm install

      # 4. Linting
      - name: Run Linter
        run: npm run lint || echo "⚠️ Linter warnings detected"

      # 5. Tests
      - name: Run Tests
        run: npm test --if-present

      # 6. Build (si applicable)
      - name: Build project
        run: npm run build --if-present

      # 7. Upload des artefacts
      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: |
            dist/
            build/
            output/

  summary:
    name: Generate Summary
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - name: Create summary
        run: |
          echo "## 🧪 Résultat du workflow avancé" >> $GITHUB_STEP_SUMMARY
          echo "- Toutes les plateformes ont été testées" >> $GITHUB_STEP_SUMMARY
          echo "- Artefacts générés pour chaque OS" >> $GITHUB_STEP_SUMMARY
          echo "- Linting et tests exécutés" >> $GITHUB_STEP_SUMMARY
