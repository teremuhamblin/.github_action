name: Advanced CI

on:
  push:
  pull_request:

jobs:
  validate:
    name: Validate Project (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      # 1. Checkout du dépôt
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Vérification des fichiers YAML
      - name: Validate YAML files
        uses: ibiqlik/action-yamllint@v3
        with:
          config_file: .yamllint.yml
        continue-on-error: true

      # 3. Vérification des fichiers Markdown
      - name: Validate Markdown
        uses: DavidAnson/markdownlint-cli2-action@v15
        continue-on-error: true

      # 4. Vérification de la structure du projet
      - name: Check project structure
        run: |
          echo "📁 Vérification de la structure du projet"
          ls -R .

  summary:
    name: Generate Summary
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Create summary
        run: |
          echo "## 🧪 Résultat du workflow Advanced CI" >> $GITHUB_STEP_SUMMARY
          echo "- Validation YAML effectuée" >> $GITHUB_STEP_SUMMARY
          echo "- Validation Markdown effectuée" >> $GITHUB_STEP_SUMMARY
          echo "- Structure du projet vérifiée" >> $GITHUB_STEP_SUMMARY
          echo "- Tests exécutés sur Ubuntu, macOS et Windows" >> $GITHUB_STEP_SUMMARY
