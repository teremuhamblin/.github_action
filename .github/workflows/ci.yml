name: Universal CI

on:
  push:
  pull_request:

jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect language
        run: |
          if [ -f "package.json" ]; then echo "node" > lang.txt; fi
          if ls *.py 1> /dev/null 2>&1; then echo "python" > lang.txt; fi
          if ls *.go 1> /dev/null 2>&1; then echo "go" > lang.txt; fi
          if ls *.rs 1> /dev/null 2>&1; then echo "rust" > lang.txt; fi

      - name: Print detected language
        run: cat lang.txt
