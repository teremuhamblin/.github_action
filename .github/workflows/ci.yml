name: Universal CI

on:
  push:
  pull_request:

jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v7

      # 2. Setup Node.js (LTS)
      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v7
        with:
          node-version: lts
          cache: npm

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci || npm install

      - name: Detect language
        run: |
          if [ -f "package.json" ]; then echo "node" > lang.txt; fi
          if ls *.py 1> /dev/null 2>&1; then echo "python" > lang.txt; fi
          if ls *.go 1> /dev/null 2>&1; then echo "go" > lang.txt; fi
          if ls *.rs 1> /dev/null 2>&1; then echo "rust" > lang.txt; fi

      - name: Print detected language
        run: cat lang.txt
