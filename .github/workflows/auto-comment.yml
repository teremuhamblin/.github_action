name: Auto Comment

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

jobs:
  auto-comment:
    name: Auto Comment
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js (LTS)
      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: lts

      # 3. Post comment
      - name: Post automatic comment
        uses: peter-evans/create-or-update-comment@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.issue.number || github.event.pull_request.number }}
          body: |
            👋 Merci pour votre contribution au projet **.github_action** !
            L’équipe va examiner cela rapidement.

      # 4. Summary
      - name: Summary
        run: |
          echo "## 💬 Commentaire automatique ajouté (.github_action)" >> $GITHUB_STEP_SUMMARY
          echo "- Cible : Issue/PR #${{ github.event.issue.number || github.event.pull_request.number }}" >> $GITHUB_STEP_SUMMARY
