name: Update Version Badge

on:
  push:
    paths:
      - "package.json"

jobs:
  update-badge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from package.json
        id: pkg
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Update version badge
        run: |
          cat > .github/badges/version.svg << 'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" width="110" height="20">
            <linearGradient id="a" x2="0" y2="100%">
              <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
              <stop offset="1" stop-opacity=".1"/>
            </linearGradient>
            <rect rx="3" width="110" height="20" fill="#555"/>
            <rect rx="3" x="55" width="55" height="20" fill="#007ec6"/>
            <path fill="#007ec6" d="M55 0h4v20h-4z"/>
            <rect rx="3" width="110" height="20" fill="url(#a)"/>
            <g fill="#fff" text-anchor="middle" font-family="Verdana" font-size="11">
              <text x="28" y="14">version</text>
              <text x="82" y="14">${{ steps.pkg.outputs.version }}</text>
            </g>
          </svg>
          EOF

      - name: Commit updated badge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/badges/version.svg
          git commit -m "chore: update version badge to ${{ steps.pkg.outputs.version }}" || echo "No changes to commit"
          git push || echo "No push"
