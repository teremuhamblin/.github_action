```svg
<svg xmlns="http://www.w3.org/2000/svg" width="210" height="24">
  <defs>
    <!-- Gradient animé -->
    <linearGradient id="grad">
      <stop offset="0%" stop-color="#6f42c1">
        <animate attributeName="offset" values="0;1;0" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#9b59d1">
        <animate attributeName="offset" values="1;0;1" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Glow subtil -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fond gauche -->
  <rect rx="4" width="210" height="24" fill="#3d3d3d"/>

  <!-- Fond droit animé -->
  <rect rx="4" x="80" width="130" height="24" fill="url(#grad)" filter="url(#glow)"/>

  <!-- Texte -->
  <g fill="#fff" text-anchor="middle" font-family="Verdana" font-size="12">
    <text x="40" y="16">Made by</text>
    <text x="145" y="16">The MadDoG.tmdg</text>
  </g>
</svg>
```
